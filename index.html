<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something For You ❤️</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Icons -->
    <link rel="icon" href="assets/heart.png">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>❤️</span>
        <span>🤍</span>
        <span>💖</span>
        <span>💕</span>
        <span>❤️</span>
        <span>💗</span>
    </div>

    <!-- Main Card -->
    <div class="container">

        <div class="card">

            <div class="emoji">
                💌
            </div>

            <h1>Hie Mam ❤️</h1>

            <p class="subtitle">
                I made something especially for you.
            </p>

            <p class="description">
                It won't take much time...
                <br><br>
                Just give me a few minutes.
                <br><br>
                I hope you like it. 🌸
            </p>

            <button id="openBtn">
                Open ❤️
            </button>

        </div>

    </div>

    <script>
        document.getElementById("openBtn").addEventListener("click", () => {

            document.body.classList.add("fadeOut");

            setTimeout(() => {
                window.location.href = "pg2.html";
            }, 700);

        });
    </script>

</body>
</html>
