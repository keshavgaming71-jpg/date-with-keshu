<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Love Subscription ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>

.infoBox{
margin:18px 0;
padding:15px;
border-radius:15px;
background:#fff5fa;
border:2px solid #ffd6e8;
}

.infoBox p{
margin:8px 0;
font-size:16px;
}

#copyBtn,#paidBtn{
margin-top:15px;
width:100%;
}

</style>

</head>

<body>

<div class="hearts">
<span>❤️</span>
<span>💕</span>
<span>💖</span>
<span>🤍</span>
<span>💗</span>
<span>❤️</span>
</div>

<div class="container">

<div class="card">

<div class="emoji">
💖
</div>

<h1>My Love Subscription</h1>

<p class="subtitle">
A tiny ₹1 to continue our date journey together ❤️
</p>

<h2 class="price">
₹1
</h2>

<div class="infoBox">

<p>
<b>👩 Name:</b>
<span id="girlName"></span>
</p>

<p>
<b>📅 Meeting Date:</b>
<span id="meetingDate"></span>
</p>

</div>

<hr>

<div class="paymentDetails">

<p><b>💳 Receiver</b></p>
<p>Keshuu (Namkeen)</p>

<br>

<p><b>🏦 UPI ID</b></p>

<p id="upiText">
keshav71@fam
</p>

</div>

<br>

<button id="copyBtn">

📋 Copy UPI ID

</button>

<br><br>

<button id="payBtn">

💖 Pay ₹1

</button>

<br><br>

<button id="paidBtn">

❤️ I Have Paid

</button>

<br><br>

<button id="backBtn" class="secondaryBtn">

⬅️ Go Back

</button>

</div>

</div>

<script>

const girlName = localStorage.getItem("girlName") || "Someone Special ❤️";

const meetingDate = localStorage.getItem("meetingDate");

document.getElementById("girlName").innerHTML = girlName;

if(meetingDate){

const formatted = new Date(meetingDate).toLocaleDateString("en-IN",{

weekday:"long",
day:"numeric",
month:"long",
year:"numeric"

});

document.getElementById("meetingDate").innerHTML = formatted;

}else{

document.getElementById("meetingDate").innerHTML = "Not Selected";

}

const upi="upi://pay?pa=keshav71@fam&pn=Keshuu%20(Namkeen)&am=1.00&cu=INR&tn=My%20Love%20Subscription";

document.getElementById("payBtn").onclick=()=>{

window.location.href=upi;

};

document.getElementById("copyBtn").onclick=()=>{

navigator.clipboard.writeText("keshav71@fam");

alert("UPI ID copied successfully ❤️");

};

document.getElementById("paidBtn").onclick=()=>{

alert("Thank you so much! ❤️");

window.location.href="final.html";

};

document.getElementById("backBtn").onclick=()=>{

history.back();

};

</script>

</body>

</html>
