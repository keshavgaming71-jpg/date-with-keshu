<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Love Subscription ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Poppins:wght@300;400;500;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>

:root{
  --cream:      #FFF6F1;
  --card:       #FFFFFF;
  --blush:      #FFE9EF;
  --rose-gold:  #C9946B;
  --wine:       #6B2737;
  --heart-red:  #E24E68;
  --muted:      #A98D95;
  --line:       #F0D9C7;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 15% 20%, #FFEFE6 0%, transparent 45%),
    radial-gradient(circle at 85% 80%, #FFE3EC 0%, transparent 45%),
    var(--cream);
  font-family:'Poppins', sans-serif;
  color: var(--wine);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:32px 16px;
  overflow-x:hidden;
}

/* ---------- floating background hearts ---------- */
.hearts{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.hearts span{
  position:absolute;
  bottom:-40px;
  font-size:22px;
  opacity:0.35;
  animation: floatUp 11s linear infinite;
}
.hearts span:nth-child(1){ left:6%;  animation-delay:0s;  font-size:18px;}
.hearts span:nth-child(2){ left:22%; animation-delay:2s;  font-size:26px;}
.hearts span:nth-child(3){ left:40%; animation-delay:4s;  font-size:16px;}
.hearts span:nth-child(4){ left:58%; animation-delay:1s;  font-size:24px;}
.hearts span:nth-child(5){ left:74%; animation-delay:3.5s;font-size:20px;}
.hearts span:nth-child(6){ left:90%; animation-delay:5s;  font-size:18px;}

@keyframes floatUp{
  0%   { transform: translateY(0) rotate(0deg);   opacity:0; }
  10%  { opacity:0.4; }
  90%  { opacity:0.2; }
  100% { transform: translateY(-110vh) rotate(20deg); opacity:0; }
}

@media (prefers-reduced-motion: reduce){
  .hearts span{ animation:none; display:none; }
  .card{ animation:none !important; }
  .priceBadge{ animation:none !important; }
}

/* ---------- card ---------- */
.wrap{ position:relative; z-index:1; width:100%; max-width:400px; }

.card{
  background: var(--card);
  border-radius: 26px;
  padding: 34px 34px 30px;
  box-shadow: 0 20px 50px -20px rgba(107,39,55,0.25), 0 2px 8px rgba(107,39,55,0.06);
  animation: riseIn 0.6s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes riseIn{
  from{ opacity:0; transform: translateY(18px); }
  to{ opacity:1; transform: translateY(0); }
}

.eyebrow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:11px;
  letter-spacing:1.6px;
  text-transform:uppercase;
  color: var(--rose-gold);
  font-weight:600;
  margin-bottom:14px;
}

h1{
  font-family:'Cormorant Garamond', serif;
  font-size:32px;
  font-weight:700;
  line-height:1.15;
  margin:0 0 8px;
  color: var(--wine);
}

.tagline{
  font-size:14px;
  color: var(--muted);
  margin:0 0 22px;
  line-height:1.5;
}
.tagline .flourish{
  font-family:'Dancing Script', cursive;
  font-size:17px;
  color: var(--heart-red);
}

/* ---------- info grid ---------- */
.info-grid{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 22px;
}
.info-grid .label{
  font-size:10px;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color: var(--muted);
  font-weight:600;
  margin-bottom:4px;
}
.info-grid .value{
  font-size:15px;
  font-weight:500;
  color: var(--wine);
}

/* ---------- ticket tear divider (signature element) ---------- */
.tear{
  position:relative;
  height:0;
  margin: 0 -34px 22px;
  border-top: 2px dashed var(--line);
}
.tear::before,
.tear::after{
  content:'';
  position:absolute;
  top:-11px;
  width:22px;
  height:22px;
  border-radius:50%;
  background: var(--cream);
  box-shadow: 0 0 0 4px var(--card) inset;
}
.tear::before{ left:-11px; }
.tear::after{ right:-11px; }

/* ---------- renewal / price ---------- */
.renewal-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}
.renewal-row .label{
  font-size:10px;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color: var(--muted);
  font-weight:600;
  margin-bottom:4px;
}
.price{
  font-family:'Cormorant Garamond', serif;
  font-size:34px;
  font-weight:700;
  color: var(--wine);
}
.priceBadge{
  width:38px; height:38px;
  border-radius:50%;
  background: var(--blush);
  display:flex; align-items:center; justify-content:center;
  font-size:17px;
  animation: pulse 1.8s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.12); }
}

/* ---------- payment details ---------- */
.pay-details{
  background: var(--blush);
  border-radius:16px;
  padding:16px 18px;
  margin-bottom:20px;
}
.pay-details .row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.pay-details .row + .row{ margin-top:12px; }
.pay-details .label{
  font-size:10px;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color: var(--rose-gold);
  font-weight:600;
  margin-bottom:2px;
}
.pay-details .value{
  font-size:14.5px;
  font-weight:500;
  color: var(--wine);
  word-break:break-all;
}
.copyIcon{
  background:none;
  border:none;
  cursor:pointer;
  font-size:16px;
  padding:4px 6px;
  border-radius:8px;
  flex-shrink:0;
}
.copyIcon:hover{ background: rgba(107,39,55,0.08); }

/* ---------- buttons ---------- */
.btn-primary{
  width:100%;
  border:none;
  cursor:pointer;
  background: linear-gradient(135deg, var(--heart-red), #C9425C);
  color:#fff;
  font-family:'Poppins', sans-serif;
  font-size:15.5px;
  font-weight:600;
  padding:15px;
  border-radius:14px;
  box-shadow: 0 10px 24px -10px rgba(226,78,104,0.6);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 14px 28px -10px rgba(226,78,104,0.7); }
.btn-primary:active{ transform: translateY(0); }

.links-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:18px;
  flex-wrap:wrap;
}
.link-btn{
  background:none;
  border:none;
  cursor:pointer;
  font-family:'Poppins', sans-serif;
  font-size:12.5px;
  font-weight:500;
  color: var(--muted);
  padding:4px 2px;
  text-decoration: underline;
  text-underline-offset:3px;
  text-decoration-color: var(--line);
}
.link-btn:hover{ color: var(--heart-red); text-decoration-color: var(--heart-red); }
.dot{ color: var(--line); font-size:12px; }

:focus-visible{
  outline: 2px solid var(--heart-red);
  outline-offset: 2px;
}

/* ---------- QR fallback ---------- */
#qrBox{
  display:none;
  text-align:center;
  margin-top:16px;
  animation: riseIn 0.35s ease both;
}
#qrBox p{
  font-size:12.5px;
  color: var(--muted);
  margin: 0 0 10px;
}
#qrImg{
  width:180px; height:180px;
  border-radius:14px;
  border:2px solid var(--line);
  padding:6px;
  background:#fff;
}

@media (max-width:380px){
  .card{ padding:28px 22px 24px; }
  h1{ font-size:27px; }
  .tear{ margin: 0 -22px 20px; }
}

</style>
</head>

<body>

<div class="hearts">
  <span>❤️</span><span>💕</span><span>💖</span><span>🤍</span><span>💗</span><span>❤️</span>
</div>

<div class="wrap">
  <div class="card">

    <div class="eyebrow">
      <span>Membership Card</span>
      <span>No. 001</span>
    </div>

    <h1>My Love Subscription</h1>
    <p class="tagline">A tiny renewal to keep <span class="flourish">our story</span> going ❤️</p>

    <div class="info-grid">
      <div>
        <div class="label">Issued To</div>
        <div class="value" id="girlName">—</div>
      </div>
      <div>
        <div class="label">Next Date</div>
        <div class="value" id="meetingDate">—</div>
      </div>
    </div>

    <div class="tear"></div>

    <div class="renewal-row">
      <div>
        <div class="label">Renewal Due</div>
        <div class="price">₹1</div>
      </div>
      <div class="priceBadge">💗</div>
    </div>

    <div class="pay-details">
      <div class="row">
        <div>
          <div class="label">Pay To</div>
          <div class="value">Keshav</div>
        </div>
      </div>
      <div class="row">
        <div>
          <div class="label">UPI ID</div>
          <div class="value" id="upiText">keshav1406@ibl</div>
        </div>
        <button class="copyIcon" id="copyBtn" aria-label="Copy UPI ID" title="Copy UPI ID">📋</button>
      </div>
    </div>

    <button class="btn-primary" id="payBtn">💖 Pay ₹1</button>

    <div id="qrBox">
      <p>App direct nahi khula? Isse camera se scan karo</p>
      <img id="qrImg" alt="UPI QR Code">
    </div>

    <div class="links-row">
      <button class="link-btn" id="paidBtn">✅ I've paid</button>
      <span class="dot">•</span>
      <button class="link-btn" id="skipBtn">Skip for now</button>
      <span class="dot">•</span>
      <button class="link-btn" id="backBtn">← Back</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<script>

emailjs.init({
    publicKey: "niOuxHNg0jG78t7wn"
});

const girlName = localStorage.getItem("girlName") || "Someone Special ❤️";
const meetingDate = localStorage.getItem("meetingDate");

document.getElementById("girlName").innerHTML = girlName;

function formattedMeetingDate(){
    return meetingDate
        ? new Date(meetingDate).toLocaleDateString("en-IN",{
            weekday:"long",
            day:"numeric",
            month:"long",
            year:"numeric"
        })
        : "Not Selected";
}

document.getElementById("meetingDate").innerHTML = formattedMeetingDate();

const upi = "upi://pay?pa=keshav1406@ibl&pn=Keshav&am=1.00&cu=INR&tn=MyLoveSubscription";

document.getElementById("payBtn").onclick = () => {
    window.location.href = upi;

    const qrImg = document.getElementById("qrImg");
    qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(upi);
    document.getElementById("qrBox").style.display = "block";
};

document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard.writeText("keshav1406@ibl");
    alert("UPI ID copied successfully ❤️");
};

document.getElementById("paidBtn").onclick = () => {

    emailjs.send(
        "service_02kskqb",
        "template_akw7l1c",
        {
            from_name: girlName,
            meeting_date: formattedMeetingDate(),
            subscription: "My Love Subscription ❤️",
            payment_status: "✅ Completed",
            submit_time: new Date().toLocaleString("en-IN")
        }
    ).then(()=>{
        alert("Thank you for your payment ❤️");
        window.location.href = "final.html";
    }).catch((err)=>{
        console.error(err);
        alert("Couldn't send confirmation email.");
    });

};

document.getElementById("skipBtn").onclick = () => {

    emailjs.send(
        "service_02kskqb",
        "template_akw7l1c",
        {
            from_name: girlName,
            meeting_date: formattedMeetingDate(),
            subscription: "My Love Subscription ❤️",
            payment_status: "❌ Skipped",
            submit_time: new Date().toLocaleString("en-IN")
        }
    ).then(()=>{
        window.location.href = "final.html";
    }).catch((err)=>{
        console.error(err);
        alert("Couldn't send email.");
    });

};

document.getElementById("backBtn").onclick = () => {
    history.back();
};

</script>

</body>
</html>
