<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Can I Ask You Something?</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="hearts">

    <span>❤️</span>
    <span>💕</span>
    <span>💖</span>
    <span>🤍</span>
    <span>💗</span>
    <span>❤️</span>

</div>

<div class="container">

<div class="card">

<div class="emoji">
🤔
</div>

<h1>Can I ask you something?</h1>

<p class="subtitle" id="typing"></p>

<button id="continueBtn">
Continue ❤️
</button>

</div>

</div>

<script>

const text =
"I've been wanting to ask you something for quite a while... and today I finally gathered the courage. 🥹❤️";

let i = 0;

function type(){

    if(i < text.length){

        document.getElementById("typing").innerHTML += text.charAt(i);

        i++;

        setTimeout(type,35);

    }

}

type();

document.getElementById("continueBtn").onclick=()=>{

    document.body.classList.add("fadeOut");

    setTimeout(()=>{

        window.location.href="pg3.html";

    },700);

}

</script>

</body>
</html>
