<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Big Question ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="hearts">
<span>❤️</span>
<span>💕</span>
<span>💖</span>
<span>🤍</span>
<span>💗</span>
<span>❤️</span>
</div>

<div class="container">

<div class="card">

<div class="emoji">🌸</div>

<h1>One Last Question...</h1>

<p class="subtitle">
Would you like to go on a date with me? 🥹❤️
</p>

<div class="btnArea">

<button id="yesBtn">
Yes ❤️
</button>

<button id="noBtn">
No 🙈
</button>

</div>

</div>

</div>

    <script> 

const noBtn = document.getElementById("noBtn");

const positions = [
    {x:20,y:20},
    {x:60,y:20},
    {x:15,y:45},
    {x:65,y:45},
    {x:35,y:10},
    {x:45,y:55},
    {x:10,y:35},
    {x:70,y:30}
];

let current = 0;

function moveButton(){

    current = (current + 1) % positions.length;

    noBtn.style.left = positions[current].x + "%";
    noBtn.style.top = positions[current].y + "%";
    noBtn.style.bottom = "auto";
    noBtn.style.transform = "none";

}

noBtn.addEventListener("mouseenter", moveButton);

noBtn.addEventListener("click", function(e){

    e.preventDefault();
    moveButton();

});

noBtn.addEventListener("touchstart", function(e){

    e.preventDefault();
    moveButton();

});

document.getElementById("yesBtn").onclick = function(){

    document.body.classList.add("fadeOut");

    setTimeout(function(){

        window.location.href = "pg4.html";

    },700);

};


        </script>
    
</body>
</html>
