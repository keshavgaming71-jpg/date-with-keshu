<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Date Confirmed ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="hearts">

<span>❤️</span>
<span>💕</span>
<span>💖</span>
<span>🤍</span>
<span>💗</span>
<span>❤️</span>

</div>

<div class="container">

<div class="card">

<div class="emoji">
🥳
</div>

<h1>Yayyyy!! ❤️</h1>

<p class="subtitle">
Glad... so we're meeting on
</p>

<h2 id="selectedDate" class="datePreview">
Loading...
</h2>

<p class="description">

I'm already excited for that day. 🥹

<br><br>

Promise me you'll come with your best smile. 😊

</p>

<button id="nextBtn">

Okay ❤️

</button>

</div>

</div>

<script>

const savedDate = localStorage.getItem("meetingDate");

if(!savedDate){

window.location.href="pg5.html";

}else{

const options={

weekday:'long',

day:'numeric',

month:'long',

year:'numeric'

};

const formatted=new Date(savedDate).toLocaleDateString(

'en-IN',

options

);

document.getElementById("selectedDate").innerHTML=

"📅 "+formatted;

}

document.getElementById("nextBtn").onclick=()=>{

document.body.classList.add("fadeOut");

setTimeout(()=>{

window.location.href="pg7.html";

},700);

};

</script>

</body>

</html>
